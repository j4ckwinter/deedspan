name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run example:install
      - run: npm run check
      - run: npm run build
      - run: npm run build --prefix examples/drafts
      - run: npm test --prefix examples/drafts
      - run: npm run test:package
      - run: npm run test:consumer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run example:install
      - run: npm run check
      - run: npm run build --prefix examples/drafts
      - run: npm test --prefix examples/drafts
      - run: npm run test:package
      - run: npm run test:consumer
